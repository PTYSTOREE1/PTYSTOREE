
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTY</title>

<style>
body {
  margin: 0;
  background: #111318;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.box {
  padding: 25px;
}

h1 {
  font-size: 42px;
  letter-spacing: 5px;
}

p {
  color: #bfc3cc;
  font-size: 17px;
}

button {
  background: #e53935;
  color: white;
  border: none;
  padding: 13px 35px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

#joke {
  display: none;
  font-size: 25px;
  color: white;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="box" id="notice">
  <h1>PTY</h1>
  <p>This page is temporarily unavailable.</p>
  <button onclick="showJoke()">Continue</button>
</div>

<div class="box" id="joke">
  😂 GOT YOU!<br>
  You really thought you had to pay $2.49! 💀
</div>

<script>
function showJoke() {
  document.getElementById("notice").style.display = "none";
  document.getElementById("joke").style.display = "block";
}
</script>

</body>
</html>
