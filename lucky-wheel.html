
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گردونه شانس | PTY STORE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#fff;
 font-family:Tahoma,Arial,sans-serif;
 background:radial-gradient(ellipse at 50% 35%,#30205a 0%,#110d20 48%,#08070d 100%);
 display:flex;align-items:center;justify-content:center;
 padding:25px 15px;
}
.wrap{width:100%;max-width:520px;text-align:center}
.brand{font-size:13px;letter-spacing:4px;color:#bda4ff;font-weight:bold}
h1{font-size:30px;margin:15px 0 8px}
.sub{color:#aaa2b9;font-size:13px;margin-bottom:32px}
.wheel-box{
 width:min(88vw,390px);aspect-ratio:1;
 margin:0 auto 28px;position:relative;
 display:grid;place-items:center;
}
.wheel-box:before{
 content:"";position:absolute;inset:-10px;border-radius:50%;
 border:3px solid #a77aff;
 box-shadow:0 0 15px #9a5cff,0 0 45px #6d35c9;
}
canvas{width:100%;height:100%;border-radius:50%;
 filter:drop-shadow(0 10px 25px #0009)}
.pointer{
 position:absolute;top:-17px;left:50%;transform:translateX(-50%);
 width:0;height:0;border-left:17px solid transparent;
 border-right:17px solid transparent;border-top:35px solid #fff;
 z-index:3;filter:drop-shadow(0 3px 5px #000);
}
.center{
 position:absolute;width:76px;height:76px;border-radius:50%;
 background:linear-gradient(145deg,#a66aff,#5424a5);
 border:5px solid #eee;box-shadow:0 0 20px #a66aff;
 display:grid;place-items:center;font-weight:900;font-size:14px;
}
.spin{
 border:0;border-radius:15px;padding:17px 45px;
 color:white;font-size:16px;font-weight:bold;cursor:pointer;
 background:linear-gradient(110deg,#9b55ff,#6225c5);
 box-shadow:0 7px 0 #3d197b,0 12px 30px #8b43ff55;
 transition:.2s;
}
.spin:hover{transform:translateY(-3px);filter:brightness(1.15)}
.spin:active{transform:translateY(3px);box-shadow:0 3px 0 #3d197b}
.spin:disabled{opacity:.6;cursor:not-allowed}
.result{
 display:none;margin:28px auto 0;padding:22px;
 border:1px solid #7545b5;border-radius:18px;
 background:#171126;max-width:390px;
}
.result.show{display:block;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.code{
 direction:ltr;font-size:22px;font-weight:bold;letter-spacing:2px;
 color:#c6a5ff;margin:15px 0;
}
.copy{
 border:1px solid #8051c5;background:#281b40;color:white;
 border-radius:10px;padding:11px 20px;cursor:pointer;
}
.note{font-size:11px;color:#777184;margin-top:30px;line-height:2}
.back{display:inline-block;color:#bda4ff;text-decoration:none;
 margin-top:20px;font-size:13px}
</style>
</head>
<body>
<main class="wrap">
 <div class="brand">PTY STORE</div>
 <h1>گردونه شانس</h1>
 <div class="sub">شانس خودتو امتحان کن و جایزه بگیر!</div>

 <div class="wheel-box">
  <div class="pointer"></div>
  <canvas id="wheel" width="700" height="700"></canvas>
  <div class="center">PTY</div>
 </div>

 <button class="spin" id="spin">✦ چرخوندن گردونه</button>

 <section class="result" id="result">
  <div id="message">تبریک! جایزه‌ات رو بردی</div>
  <div class="code" id="code"></div>
  <button class="copy" onclick="copyCode()">کپی کد تخفیف</button>
 </section>

 <div class="note">
  نسخه آزمایشی PTY STORE<br>
  کدهای این نسخه فقط در همین مرورگر ذخیره می‌شوند.
 </div>
 <a class="back" href="index.html">بازگشت به فروشگاه ←</a>
</main>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const spinBtn=document.getElementById("spin");
const result=document.getElementById("result");

const prizes=[
 {text:"۵۰ هزار تومان",win:true},
 {text:"شانس دوباره",win:false},
 {text:"۵۰ هزار تومان",win:true},
 {text:"شانس دوباره",win:false},
 {text:"۵۰ هزار تومان",win:true},
 {text:"شانس دوباره",win:false},
 {text:"۵۰ هزار تومان",win:true},
 {text:"شانس دوباره",win:false}
];

const colors=["#7135b9","#25143e","#914ee0","#21132f",
 "#7135b9","#25143e","#914ee0","#21132f"];

let rotation=0;
let spinning=false;

function drawWheel(){
 const cx=350,cy=350,r=330;
 const arc=Math.PI*2/prizes.length;
 ctx.clearRect(0,0,700,700);

 prizes.forEach((p,i)=>{
  const start=rotation+i*arc-Math.PI/2;
  const end=start+arc;

  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,r,start,end);
  ctx.closePath();
  ctx.fillStyle=colors[i];
  ctx.fill();
  ctx.strokeStyle="#d9baff";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(start+arc/2);
  ctx.textAlign="right";
  ctx.fillStyle="#fff";
  ctx.font="bold 25px Tahoma";
  ctx.shadowColor="#000";
  ctx.shadowBlur=5;
  ctx.fillText(p.text,260,9);
  ctx.restore();
 });

 ctx.beginPath();
 ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.strokeStyle="#d5b4ff";
 ctx.lineWidth=12;
 ctx.stroke();
}
drawWheel();

spinBtn.addEventListener("click",()=>{
 if(spinning)return;

 spinning=true;
 spinBtn.disabled=true;
 result.classList.remove("show");

 // در نسخه دمو، احتمال جایزه ۵۰ هزار بیشتر است.
 const selected=Math.random()<0.65 ? [0,2,4,6][Math.floor(Math.random()*4)]
                                  : [1,3,5,7][Math.floor(Math.random()*4)];

 const arc=Math.PI*2/prizes.length;
 const target=-(selected*arc+arc/2);
 const current=rotation;
 const extra=Math.PI*2*6;
 const finalRotation=extra+target;

 const start=performance.now();
 const duration=5200;

 function animate(now){
  const progress=Math.min((now-start)/duration,1);
  const ease=1-Math.pow(1-progress,5);
  rotation=current+finalRotation*ease;
  drawWheel();

  if(progress<1){
   requestAnimationFrame(animate);
  }else{
   rotation=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
   drawWheel();
   finish(selected);
  }
 }
 requestAnimationFrame(animate);
});

function finish(index){
 spinning=false;
 spinBtn.disabled=false;

 if(prizes[index].win){
  const code="PTY-"+Math.random().toString(36).substring(2,6).toUpperCase()
                 +"-"+Math.random().toString(36).substring(2,6).toUpperCase();

  document.getElementById("message").textContent="تبریک! ۵۰ هزار تومان تخفیف بردی 🎉";
  document.getElementById("code").textContent=code;

  const saved=JSON.parse(localStorage.getItem("pty_demo_codes")||"[]");
  saved.push({code:code,discount:50000,used:false});
  localStorage.setItem("pty_demo_codes",JSON.stringify(saved));
 }else{
  document.getElementById("message").textContent="این بار نشد! دوباره امتحان کن";
  document.getElementById("code").textContent="شانس دوباره";
 }
 result.classList.add("show");
}

function copyCode(){
 const code=document.getElementById("code").textContent;
 if(code.startsWith("PTY-")){
  navigator.clipboard.writeText(code);
  document.querySelector(".copy").textContent="کپی شد ✓";
 }
}
</script>
</body>
</html>
